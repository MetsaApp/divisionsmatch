# A golden race: a real competition and its official divisionsmatch result.
# The test computes the result from results.xml and compares it with the
# official printouts in the official folder.
#
# Race:  1., 2. og 3. division Nord, 1. runde
# Date:  2026-05-10
# Venue: Hesselholt
#
# The official printouts of this race are scanned PDF files. The files
# in the official folder are a transcription by hand of their summary
# pages: the season standing, the match blocks and the group-by-match
# grid. They have no runner rows.
#
# All runner names are generic names ("Runner 001"). A runner has the same
# generic name in results.xml and in the official folder. The test does
# not read names.

